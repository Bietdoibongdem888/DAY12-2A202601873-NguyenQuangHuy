name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python checkpoints
    runs-on: ubuntu-latest
    env:
      AGENT_API_KEY: ci-only
      REDIS_URL: fake://
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run local checkpoints
        run: >-
          python -m pytest
          tests/test_cp1.py tests/test_cp2.py tests/test_cp3.py tests/test_cp4.py
          -v -m "not docker"

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t day12-agent:ci .

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Trigger deployment
        if: env.DEPLOY_HOOK_URL != ''
        run: |
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
      - name: Smoke test
        if: env.DEPLOY_HOOK_URL != '' && env.PUBLIC_URL != ''
        run: curl --fail --silent --show-error --retry 12 --retry-delay 10 "$PUBLIC_URL/health"
